[data]
run_dir = "data/runs/neko_v3_500"
tool_universe_paths = [
  "data/tool_universes/neko_real_v1",
  "data/tool_universes/synthetic_plugins_v1",
  "data/tool_universes/synthetic_plugins_v2",
  "data/tool_universes/synthetic_plugins_v3",
  "data/tool_universes/synthetic_plugins_v4",
]
val_ratio = 0.2
seed = 20260526
label_field = "confidence"

[encoder]
backend = "jina_sequence"
model_name = "jinaai/jina-embeddings-v5-text-nano-retrieval"
max_length = 128
batch_size = 8
cache_dir = "experiments/tool_rerank_baseline/cache"

[model]
kind = "sequence_late_interaction"
head = "mlp"
hidden_dim = 256
dropout = 0.1

[lexical]
enabled = true
fusion = "gated_add"
dropout = 0.05
word_max_features = 20000
char_max_features = 20000
bm25_k1 = 1.5
bm25_b = 0.75

[train]
epochs = 20
batch_size = 64
grad_accum_steps = 2
lr = 0.0003
weight_decay = 0.0003
pairwise_weight = 0.1
pairwise_margin = 0.1
device = "cpu"

[eval]
high_label_threshold = 1.0
high_pred_threshold = 1.0
topk = 3

[output]
run_name = "jina_sequence_lexical_gated_v22c_stable"
run_root = "experiments/tool_rerank_baseline/runs"
