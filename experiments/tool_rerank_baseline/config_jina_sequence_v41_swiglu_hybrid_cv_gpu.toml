[data]
run_dir = "data/runs/neko_v4_multiaxis_500"
tool_universe_paths = [
  "data/tool_universes/neko_real_v1",
  "data/tool_universes/synthetic_plugins_v1",
  "data/tool_universes/synthetic_plugins_v2",
  "data/tool_universes/synthetic_plugins_v3",
  "data/tool_universes/synthetic_plugins_v4",
]
val_ratio = 0.2
seed = 20260526
label_field = "confidence"
require_axis_scores = true

[cross_validation]
cv_ratio = 0.2
holdout_ratio = 0.2
folds = 5

[encoder]
backend = "jina_sequence"
model_name = "jinaai/jina-embeddings-v5-text-nano-retrieval"
max_length = 128
batch_size = 64
cache_dir = "experiments/tool_rerank_baseline/cache"

[model]
kind = "factorized_late_interaction"
hidden_dim = 256
factor_hidden_dim = 128
final_feature_dim = 32
final_head = "swiglu"
use_factor_interactions = true
detach_factors_for_final = false
dropout = 0.1

[lexical]
enabled = true
fusion = "gated_add"
dropout = 0.05
word_max_features = 20000
char_max_features = 20000
bm25_k1 = 1.5
bm25_b = 0.75

[train]
epochs = 8
batch_size = 64
lr = 0.001
weight_decay = 0.0001
device = "cuda"

[loss]
pointwise_weight = 0.6
factor_weight = 0.3
lambda_ndcg_weight = 0.3
lambda_ndcg_topk = 5
lambda_ndcg_sigma = 1.0
lambda_ndcg_min_label_gap = 0.05

[eval]
high_label_threshold = 1.0
high_pred_threshold = 1.0
topk = 3

[output]
run_name = "jina_sequence_v41_swiglu_hybrid_cv_gpu"
run_root = "experiments/tool_rerank_baseline/runs"
