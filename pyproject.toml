[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-relevance-lab"
version = "0.1.0"
description = "Experiments for context-aware tool relevance scoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.11",
    "datasets>=4.4",
    "einops>=0.8",
    "hydra-core>=1.3",
    "ipykernel>=7.1",
    "ipywidgets>=8.1",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "omegaconf>=2.3",
    "pandas>=2.3",
    "pydantic>=2.11",
    "scikit-learn>=1.7",
    "seaborn>=0.13",
    "tensorboard>=2.20",
    "torch>=2.7",
    "tqdm>=4.67",
    "transformers>=4.57",
    "wandb>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tool_relevance_lab"]
